name: Cambridge Blockchain
description: >-
  Cambridge Blockchain, Inc. was a blockchain-based digital identity and
  compliance software company founded in 2015 and headquartered in Cambridge /
  Boston, Massachusetts. Its enterprise platform let financial institutions
  deliver strong digital identities to end users while meeting KYC/AML and data
  privacy obligations (including European GDPR), giving individuals control over
  their own personal identity data shared across institutions. The company was
  backed by investors including Partech and PayPal, and was acquired by
  Blockchains, Inc. in December 2020, after which its team and identity
  technology were folded into Blockchains' digital identity product. The former
  company website (cambridge-blockchain.com) is no longer served; the surviving
  public developer surface is its GitHub organization and two first-party npm
  cryptographic libraries. No public HTTP API, OpenAPI specification, developer
  portal, or hosted documentation was ever published.
